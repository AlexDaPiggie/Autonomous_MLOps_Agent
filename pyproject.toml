[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-agent-supervisor"
version = "0.1.0"
description = "Local, fail-closed research controller for Kaggle workflows"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
models = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pandas>=2.0"]
parquet = ["pyarrow>=14"]
boosting = ["catboost>=1.2", "lightgbm>=4", "xgboost>=2"]
search = ["optuna>=3"]
forecast = ["mlforecast>=0.13", "statsforecast>=1.7"]
optimization = ["ortools>=9"]

[project.scripts]
kaggle-agent = "kaggle_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["kaggle_agent*"]
